<!-- Vendored, not loaded from a CDN: the app has to keep working whatever happens to
     someone else's server. See app/strokes/LICENSE.txt. -->
<script src="strokes/hanzi-writer.min.js"></script>
<script>
(function () {
  "use strict";

  // ---------- CSV parsing (RFC4180-style: handles quoted fields with embedded commas/newlines) ----------
  function parseCSV(rawText) {
    // Excel and some editors prepend a UTF-8 BOM; left in place it corrupts the first header name.
    const text = rawText.charCodeAt(0) === 0xfeff ? rawText.slice(1) : rawText;
    const rows = [];
    let row = [];
    let field = "";
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else { inQuotes = false; }
        } else {
          field += c;
        }
      } else {
        if (c === '"') {
          inQuotes = true;
        } else if (c === ",") {
          row.push(field);
          field = "";
        } else if (c === "\n") {
          row.push(field);
          rows.push(row);
          row = [];
          field = "";
        } else if (c === "\r") {
          // ignore; \n (if present) ends the row
        } else {
          field += c;
        }
      }
    }
    if (field.length > 0 || row.length > 0) {
      row.push(field);
      rows.push(row);
    }
    return rows.filter(r => !(r.length === 1 && r[0].trim() === ""));
  }

  function rowsToItems(rawRows) {
    if (rawRows.length === 0) return { items: [], skipped: 0 };
    const header = rawRows[0].map(h => h.trim().toLowerCase());
    const idx = {
      hanzi: header.indexOf("hanzi"),
      pinyin: header.indexOf("pinyin"),
      meaning: header.indexOf("meaning"),
      tags: header.indexOf("tags"),
    };
    const items = [];
    let skipped = 0;
    for (let i = 1; i < rawRows.length; i++) {
      const r = rawRows[i];
      const hanzi = idx.hanzi >= 0 ? (r[idx.hanzi] || "").trim() : "";
      const pinyin = idx.pinyin >= 0 ? (r[idx.pinyin] || "").trim() : "";
      const meaning = idx.meaning >= 0 ? (r[idx.meaning] || "").trim() : "";
      const tags = idx.tags >= 0 ? (r[idx.tags] || "").trim() : "";
      if (!hanzi || !pinyin || !meaning) {
        skipped++;
        continue;
      }
      items.push({ hanzi, pinyin, meaning, tags });
    }
    return { items, skipped };
  }

  // ---------- Sentence files (lessonNN.sentences.csv; format in SPEC.md, "Sentence data") ----------
  // Whitespace of any width separates words — \s covers the full-width U+3000 that models emit.
  function splitWords(text) {
    return text.trim().split(/\s+/).filter(Boolean);
  }

  function rowsToSentences(rawRows) {
    if (rawRows.length === 0) return { sentences: [], skipped: 0 };
    const header = rawRows[0].map(h => h.trim().toLowerCase());
    const col = name => header.indexOf(name);
    const at = (r, name) => col(name) >= 0 ? (r[col(name)] || "").trim() : "";
    const sentences = [];
    let skipped = 0;
    for (let i = 1; i < rawRows.length; i++) {
      const r = rawRows[i];
      let chinese = at(r, "chinese");
      const english = at(r, "english");
      // The final mark is shown fixed at the end of the line, never as a tile.
      const end = /[。？！]$/.exec(chinese);
      if (end) chinese = chinese.slice(0, -1);
      const tokens = splitWords(chinese);
      const pinyin = splitWords(at(r, "pinyin"));
      if (tokens.length < 2 || tokens.length !== pinyin.length || !english) {
        skipped++;
        continue;
      }
      const also = at(r, "also").split("|").map(splitWords).filter(a => a.length === tokens.length);
      const gaps = [];
      for (const entry of at(r, "gaps").split(";")) {
        const eq = entry.indexOf("=");
        if (eq < 0) continue;
        const word = entry.slice(0, eq).trim();
        const wrong = entry.slice(eq + 1).split("/").map(w => w.trim()).filter(Boolean);
        // The validator guarantees all of this; the app just refuses to ask a broken gap.
        if (wrong.length === 3 && tokens.filter(t => t === word).length === 1) gaps.push({ word, wrong });
      }
      sentences.push({ tokens, pinyin, end: end ? end[0] : "", english, also, gaps });
    }
    return { sentences, skipped };
  }

  // ---------- Question generation ----------
  const MIN_DISTINCT = 5; // see SPEC.md: Minimum dataset size
  const DISTRACTOR_RESAMPLE_CAP = 10;

  const DIRECTIONS = [
    { key: "hanzi->meaning", mode: "text", promptCol: "hanzi", answerCol: "meaning", label: "What does this mean?" },
    { key: "meaning->hanzi", mode: "text", promptCol: "meaning", answerCol: "hanzi", label: "Which word means this?" },
    { key: "hanzi->pinyin", mode: "text", promptCol: "hanzi", answerCol: "pinyin", label: "How do you read this?" },
    { key: "pinyin->hanzi", mode: "text", promptCol: "pinyin", answerCol: "hanzi", label: "Which word is this pinyin?" },
    { key: "pinyin->meaning", mode: "text", promptCol: "pinyin", answerCol: "meaning", label: "What does this pinyin mean?" },
    { key: "meaning->pinyin", mode: "text", promptCol: "meaning", answerCol: "pinyin", label: "How do you say this in pinyin?" },
    { key: "audio->pinyin", mode: "audio", answerCol: "pinyin", label: "Which pinyin do you hear?" },
    { key: "audio->hanzi", mode: "audio", answerCol: "hanzi", label: "Which character do you hear?" },
    { key: "audio->meaning", mode: "audio", answerCol: "meaning", label: "What does this mean?" },
  ];

  // Which question types the four toggles enable. Note the deliberate asymmetry: turning on
  // CHARACTERS also brings character<->pinyin (reading a character aloud is a character skill),
  // whereas PINYIN alone only unlocks pinyin<->english. Listening always runs from Chinese
  // outward — English is never the prompt, since English isn't what's being learned.
  //
  // WRITING and SENTENCES each add a question kind beside the word directions above; see
  // "Start-screen controls" in SPEC.md for when each one can actually run.
  const toggles = {
    reading: true, hearing: true, writing: true,
    pinyin: true, characters: true, sentences: true,
  };

  function allowedDirectionKeys() {
    const keys = new Set();
    const anyScript = toggles.pinyin || toggles.characters;
    if (toggles.reading) {
      if (toggles.characters) {
        keys.add("hanzi->meaning");
        keys.add("meaning->hanzi");
        keys.add("hanzi->pinyin");
        keys.add("pinyin->hanzi");
      }
      if (toggles.pinyin) {
        keys.add("pinyin->meaning");
        keys.add("meaning->pinyin");
      }
    }
    if (toggles.hearing && anyScript) {
      keys.add("audio->meaning");
      keys.add("audio->pinyin");
      if (toggles.characters) keys.add("audio->hanzi");
    }
    return keys;
  }

  // ---------- Pinyin -> audio filename (mirrors tools/fetch_audio.py) ----------
  const TONE_MARKS = { "̄": "1", "́": "2", "̌": "3", "̀": "4" };

  function pinyinToAscii(syllable) {
    let tone = "5";
    let out = "";
    for (const ch of syllable.trim().normalize("NFD")) {
      if (TONE_MARKS[ch]) tone = TONE_MARKS[ch];
      else out += ch;              // keeps U+0308, so ü survives to be mapped below
    }
    const base = out.normalize("NFC").toLowerCase().replace(/ü/g, "v");
    return /^[a-z]+$/.test(base) ? base + tone : null;
  }

  // Greedy longest-match split into syllables we actually hold audio for. Returns null if
  // any syllable is missing — the app never plays approximated audio, it just skips the item.
  function segmentPinyin(pinyin, available) {
    const result = [];
    for (const chunk of pinyin.split(/\s+/)) {
      for (const part of chunk.split(/['’]/)) {
        let i = 0;
        while (i < part.length) {
          let matched = 0;
          for (let len = Math.min(7, part.length - i); len > 0; len--) {
            const candidate = pinyinToAscii(part.slice(i, i + len));
            if (candidate && available.has(candidate)) {
              result.push(candidate);
              matched = len;
              break;
            }
          }
          if (!matched) return null;
          i += matched;
        }
      }
    }
    return result.length ? result : null;
  }

  function distinctValuesByColumn(items) {
    const cols = ["hanzi", "pinyin", "meaning"];
    const result = {};
    for (const col of cols) {
      result[col] = Array.from(new Set(items.map(it => it[col])));
    }
    return result;
  }

  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function setKey(values) {
    return values.slice().sort().join("");
  }

  function createQuizState(items, audioAvailable, sentenceList) {
    const sentences = sentenceList || [];
    const distinct = distinctValuesByColumn(items);
    const syllableCount = items.map(it => Array.from(it.hanzi).length);
    const audioFor = items.map(it =>
      audioAvailable && audioAvailable.size ? segmentPinyin(it.pinyin, audioAvailable) : null);
    const audioCount = audioFor.filter(Boolean).length;

    const validDirections = DIRECTIONS.filter(d =>
      distinct[d.answerCol].length >= MIN_DISTINCT && (d.mode !== "audio" || audioCount > 0));

    let rowQueue = [];
    const lastDistractorSet = {}; // key: `${rowIndex}:${direction.key}` -> sorted joined string

    function refillQueue() {
      rowQueue = shuffled(items.map((_, i) => i));
    }

    // Options must not be separable without knowing any Chinese. A two-syllable answer among
    // one-syllable distractors is solvable on shape alone, so same-length options are
    // preferred wherever length is visible (hanzi and pinyin, not English glosses).
    function distractorPool(rowIndex, direction) {
      const row = items[rowIndex];
      const col = direction.answerCol;
      const correctValue = row[col];

      // Homophones are ordinary in Mandarin (九 and 久 are both jiǔ) and telling them apart is
      // worth drilling, so the deck keeps both. But when the prompt identifies the word by sound
      // alone — a recording, or a line of pinyin — every homophone of the answer is equally
      // correct, so no two of them may share a question. Where the prompt is a character or an
      // English gloss there is no such ambiguity and homophones make excellent distractors.
      const soundOnlyPrompt = direction.mode === "audio" || direction.promptCol === "pinyin";

      const usable = [];
      for (let i = 0; i < items.length; i++) {
        if (items[i][col] === correctValue) continue;
        if (soundOnlyPrompt && items[i].pinyin === row.pinyin) continue;
        usable.push(i);
      }

      const values = indices => Array.from(new Set(indices.map(i => items[i][col])));
      if (col !== "hanzi" && col !== "pinyin") {
        return { matched: values(usable), rest: [] };
      }

      const want = syllableCount[rowIndex];
      const matched = values(usable.filter(i => syllableCount[i] === want));
      const rest = values(usable).filter(v => matched.indexOf(v) < 0);
      return { matched, rest };
    }

    function sampleDistractors(pool) {
      const picked = shuffled(pool.matched).slice(0, 3);
      if (picked.length < 3) {
        picked.push.apply(picked, shuffled(pool.rest).slice(0, 3 - picked.length));
      }
      return picked;
    }

    function build(rowIndex, direction) {
      const row = items[rowIndex];
      const correctValue = row[direction.answerCol];
      const pool = distractorPool(rowIndex, direction);
      if (pool.matched.length + pool.rest.length < 3) return null;

      const trackKey = rowIndex + ":" + direction.key;
      let distractors = sampleDistractors(pool);
      let attempts = 0;
      while (
        lastDistractorSet[trackKey] !== undefined &&
        setKey(distractors) === lastDistractorSet[trackKey] &&
        attempts < DISTRACTOR_RESAMPLE_CAP
      ) {
        distractors = sampleDistractors(pool);
        attempts++;
      }
      lastDistractorSet[trackKey] = setKey(distractors);

      return {
        kind: "word",
        promptLabel: direction.label,
        mode: direction.mode,
        promptValue: direction.mode === "audio" ? "" : row[direction.promptCol],
        promptIsHanzi: direction.promptCol === "hanzi",
        audioFiles: direction.mode === "audio" ? audioFor[rowIndex] : null,
        row,
        options: shuffled([correctValue, ...distractors]),
        correctValue,
      };
    }

    function directionsFor(rowIndex, allowed) {
      return validDirections.filter(d =>
        allowed.has(d.key) && (d.mode !== "audio" || audioFor[rowIndex]));
    }

    function nextWordQuestion() {
      const allowed = allowedDirectionKeys();
      // Some rows can't satisfy the current toggles at all (e.g. listening-only mode and an
      // item with no audio), so walk the queue until one can rather than giving up.
      for (let attempt = 0; attempt < items.length; attempt++) {
        if (rowQueue.length === 0) refillQueue();
        const rowIndex = rowQueue.shift();
        for (const direction of shuffled(directionsFor(rowIndex, allowed))) {
          const question = build(rowIndex, direction);
          if (question) return question;
        }
      }
      return null;
    }

    function countAvailable() {
      const allowed = allowedDirectionKeys();
      return items.reduce(
        (total, _, i) => total + (directionsFor(i, allowed).length > 0 ? 1 : 0), 0);
    }

    // Only words whose every character has stroke data can be drawn — all of them, once
    // tools/fetch_strokes.py has been run for the current decks.
    const writable = items.map((_, i) => i).filter(i =>
      Array.from(items[i].hanzi).every(c => strokeIndex.has(strokeKey(c))));
    let writeQueue = [];
    let sentenceQueue = [];

    function nextWriteQuestion() {
      if (writeQueue.length === 0) writeQueue = shuffled(writable);
      const rowIndex = writeQueue.shift();
      return { kind: "write", row: items[rowIndex], audioFiles: audioFor[rowIndex] };
    }

    // Order and Gap weigh the same; a sentence with no gap listed can only be ordered.
    function nextSentenceQuestion() {
      if (sentenceQueue.length === 0) sentenceQueue = shuffled(sentences.map((_, i) => i));
      const sentence = sentences[sentenceQueue.shift()];
      if (sentence.gaps.length && Math.random() < 0.5) {
        const gap = sentence.gaps[Math.floor(Math.random() * sentence.gaps.length)];
        return {
          kind: "gap", sentence, gap,
          options: shuffled([gap.word].concat(gap.wrong)),
          correctValue: gap.word,
        };
      }
      return { kind: "order", sentence };
    }

    const anyScript = () => toggles.pinyin || toggles.characters;
    const wordRuns = () => allowedDirectionKeys().size > 0 && countAvailable() > 0;
    // There is no writing pinyin, so Writing needs Characters whatever else is on.
    const writeRuns = () => toggles.writing && toggles.characters && writable.length > 0;
    const sentenceRuns = () => toggles.sentences && anyScript() && sentences.length > 0;

    // A kind first, uniformly among those that can run, then a question within it — so
    // turning Sentences on gives sentences a fair share however many words are selected.
    function nextQuestion() {
      const kinds = [];
      if (wordRuns()) kinds.push(nextWordQuestion);
      if (writeRuns()) kinds.push(nextWriteQuestion);
      if (sentenceRuns()) kinds.push(nextSentenceQuestion);
      for (const make of shuffled(kinds)) {
        const question = make();
        if (question) return question;
      }
      return null;
    }

    return {
      validDirections, nextQuestion, audioCount, countAvailable,
      wordRuns, writeRuns, sentenceRuns,
      writeCount: writable.length, sentenceCount: sentences.length,
    };
  }

  // ---------- UI wiring ----------
  const fileInput = document.getElementById("file-input");
  const chooseFileBtn = document.getElementById("choose-file-btn");
  const fileNameEl = document.getElementById("file-name");
  const loadStatus = document.getElementById("load-status");
  const startBtn = document.getElementById("start-btn");
  const loadScreen = document.getElementById("load-screen");
  const quizScreen = document.getElementById("quiz-screen");
  const toggleButtons = Array.from(document.querySelectorAll(".toggle[data-toggle]"));
  const toggleNote = document.getElementById("toggle-note");
  const lessonGroup = document.getElementById("lesson-group");
  const lessonRow = document.getElementById("lesson-row");
  const lessonAllBtn = document.getElementById("lesson-all-btn");
  const modeSwitch = document.getElementById("mode-switch");
  const modeButtons = Array.from(document.querySelectorAll(".mode-opt[data-mode]"));
  const howBlock = document.getElementById("how-block");
  const practiceScreen = document.getElementById("practice-screen");
  const practiceBack = document.getElementById("practice-back");
  const quizBack = document.getElementById("quiz-back");
  const practiceFilter = document.getElementById("practice-filter");
  const practiceStatus = document.getElementById("practice-status");
  const vocabList = document.getElementById("vocab-list");
  const replayBtn = document.getElementById("replay-btn");
  const promptLabelEl = document.getElementById("prompt-label");
  const promptValueEl = document.getElementById("prompt-value");
  const optionsEl = document.getElementById("options");
  const nextBtn = document.getElementById("next-btn");
  const strokeSheet = document.getElementById("stroke-sheet");
  const strokeTitle = document.getElementById("stroke-title");
  const strokeWordSub = document.getElementById("stroke-word-sub");
  const strokeChars = document.getElementById("stroke-chars");
  const strokeTarget = document.getElementById("stroke-target");
  const strokeCount = document.getElementById("stroke-count");
  const partsBox = document.getElementById("stroke-parts");
  const strokeClose = document.getElementById("stroke-close");
  const strokeReplay = document.getElementById("stroke-replay");
  const strokeSay = document.getElementById("stroke-say");
  const writingToggle = document.querySelector('.toggle[data-toggle="writing"]');
  const sentencesToggle = document.querySelector('.toggle[data-toggle="sentences"]');
  const promptSubEl = document.getElementById("prompt-sub");
  const sentenceLine = document.getElementById("sentence-line");
  const tileBank = document.getElementById("tile-bank");
  const sentenceResult = document.getElementById("sentence-result");
  const checkBtn = document.getElementById("check-btn");
  const writeArea = document.getElementById("write-area");
  const writeDone = document.getElementById("write-done");
  const writeTarget = document.getElementById("write-target");
  const writeShow = document.getElementById("write-show");
  const writeResult = document.getElementById("write-result");

  let quiz = null;
  let audioIndex = new Set();
  // codepoint (4-digit lowercase hex, the filename) -> stroke count. Empty when the
  // animations have not been fetched, which simply leaves the characters as plain text.
  let strokeIndex = new Map();
  // What each character is made of: { chars: {codepoint: {parts, hint, radical, ...}},
  // parts: {component: {gloss, pinyin}} }. Empty when parts.json has not been fetched,
  // which simply leaves the sheet showing the animation alone.
  let partsData = { chars: {}, parts: {} };
  let bundledDecks = [];              // every lesson the manifest lists, parsed once on load
  const selectedDecks = new Set();    // filenames of the lessons currently being drilled
  // hanzi -> pinyin over every bundled deck, selected or not: a gap's wrong options are
  // written as characters only, and a lesson-6 sentence may offer a lesson-1 word.
  let pinyinByHanzi = new Map();

  // TEST drills the selected words as multiple-choice questions; PRACTICE shows them as a
  // vocabulary table to read through, so a lesson can be studied without the book. Both run
  // off the same deck selection, and PRACTICE reuses the Pinyin/Characters toggles to choose
  // its columns. Test is the default, because drilling is what the app is for.
  let mode = "test";

  // The table is grouped by lesson, so practice keeps the decks apart where the quiz merges
  // them. Deduplication still matches the quiz pool: a word kept by the lesson that had it first.
  let practiceGroups = [];

  // Everything useItems() was last given, so switching mode can re-evaluate the same load
  // (what counts as an error differs between the two modes).
  let lastLoad = null;

  function setStatus(text, isError) {
    loadStatus.textContent = text;
    loadStatus.classList.toggle("error", Boolean(isError));
  }

  function useItems(items, skipped, sourceLabel, groups, sentences) {
    lastLoad = { items, skipped, sourceLabel, groups, sentences };
    startBtn.disabled = true;
    quiz = null;
    practiceGroups = groups || [{ title: "Vocabulary", items }];
    if (items.length === 0) {
      practiceGroups = [];
      setStatus("No usable rows found (need hanzi, pinyin and meaning columns).", true);
      return;
    }
    const candidate = createQuizState(items, audioIndex, sentences);
    if (candidate.validDirections.length === 0) {
      // Too thin to build questions from. That stops the quiz but not the table, so it is
      // only an error in test mode.
      setStatus(
        "Loaded " + items.length + " word(s), but no column has " + MIN_DISTINCT +
        "+ distinct values, so no question can be generated. Add more varied rows.",
        mode === "test");
      refreshToggles();
      return;
    }
    quiz = candidate;
    let msg = items.length + " words loaded" + (sourceLabel ? " " + sourceLabel : "") + ".";
    if (candidate.audioCount > 0) msg += " " + candidate.audioCount + " with audio.";
    if (candidate.sentenceCount > 0) {
      msg += " " + candidate.sentenceCount + " sentence" + (candidate.sentenceCount === 1 ? "" : "s") + ".";
    }
    if (skipped > 0) msg += " " + skipped + " row(s) skipped (missing column).";
    setStatus(msg, false);
    refreshToggles();
  }

  // ---------- Bundled lessons (served from the repo; added by committing a CSV + listing it in manifest.json) ----------
  function mergeItems(lists) {
    const seen = new Set();
    const merged = [];
    for (const list of lists) {
      for (const item of list) {
        const key = item.hanzi + "" + item.pinyin + "" + item.meaning;
        if (seen.has(key)) continue;
        seen.add(key);
        merged.push(item);
      }
    }
    return merged;
  }

  // "lesson02.csv" -> "Lesson 2". Anything else keeps its own name, minus the extension.
  function deckTitle(fileName) {
    const base = fileName.replace(/\.csv$/i, "");
    const numbered = /^lesson[-_ ]?0*(\d+)$/i.exec(base);
    return numbered ? "Lesson " + numbered[1] : base;
  }

  async function loadBundledDecks() {
    const manifestRes = await fetch("decks/manifest.json", { cache: "no-store" });
    if (!manifestRes.ok) throw new Error("manifest " + manifestRes.status);
    const deckFiles = await manifestRes.json();

    const decks = [];
    const sentenceFiles = new Map();   // "lesson03" -> parsed lesson03.sentences.csv
    for (const name of deckFiles) {
      const res = await fetch("decks/" + name, { cache: "no-store" });
      if (!res.ok) continue;
      const text = await res.text();
      // A sentence file belongs to the lesson of the same name rather than being one, so it
      // never becomes a chip of its own.
      if (/\.sentences\.csv$/i.test(name)) {
        sentenceFiles.set(name.replace(/\.sentences\.csv$/i, ""), rowsToSentences(parseCSV(text)));
        continue;
      }
      const parsed = rowsToItems(parseCSV(text));
      decks.push({ name, title: deckTitle(name), items: parsed.items, skipped: parsed.skipped });
    }
    if (decks.length === 0) throw new Error("no deck loaded");
    for (const deck of decks) {
      const own = sentenceFiles.get(deck.name.replace(/\.csv$/i, ""));
      deck.sentences = own ? own.sentences : [];
      deck.skipped += own ? own.skipped : 0;
    }
    return decks;
  }

  // Selecting several lessons merges them into one pool, so questions — and the wrong options,
  // which are drawn from that same pool — mix across every lesson selected.
  function applyDeckSelection() {
    const chosen = bundledDecks.filter(d => selectedDecks.has(d.name));
    lessonRow.querySelectorAll("button").forEach(btn => {
      const on = selectedDecks.has(btn.dataset.deck);
      btn.classList.toggle("on", on);
      btn.setAttribute("aria-pressed", String(on));
    });

    lessonAllBtn.textContent = chosen.length === bundledDecks.length ? "Clear" : "All";

    if (chosen.length === 0) {
      quiz = null;
      practiceGroups = [];
      lastLoad = null;
      startBtn.disabled = true;
      toggleNote.textContent = "";
      setStatus("Pick at least one lesson.", true);
      return;
    }

    const label = chosen.length === bundledDecks.length && chosen.length > 1
      ? "from all " + chosen.length + " lessons"
      : "from " + chosen.map(d => d.title).join(", ");
    // Dedupe across lessons exactly as the quiz pool does, keeping the earliest lesson's copy,
    // so the table never shows the same word twice.
    const seen = new Set();
    const groups = chosen.map(d => ({
      title: d.title,
      items: d.items.filter(it => {
        const key = it.hanzi + "" + it.pinyin + "" + it.meaning;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      }),
    }));

    quiz = null;   // if useItems rejects this selection it must not leave the previous one armed
    useItems(
      mergeItems(chosen.map(d => d.items)),
      chosen.reduce((n, d) => n + d.skipped, 0),
      label,
      groups,
      chosen.flatMap(d => d.sentences));
  }

  function renderLessonChips() {
    lessonRow.textContent = "";
    for (const deck of bundledDecks) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "toggle";
      btn.dataset.deck = deck.name;
      btn.textContent = deck.title;
      btn.addEventListener("click", () => {
        if (selectedDecks.has(deck.name)) selectedDecks.delete(deck.name);
        else selectedDecks.add(deck.name);
        applyDeckSelection();
      });
      lessonRow.appendChild(btn);
    }
    lessonGroup.classList.toggle("hidden", bundledDecks.length < 2);
  }

  chooseFileBtn.addEventListener("click", () => {
    fileInput.click();
  });

  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    startBtn.disabled = true;
    fileNameEl.textContent = file ? file.name : "No file selected";
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      const { items, skipped } = rowsToItems(parseCSV(String(reader.result)));
      lessonGroup.classList.add("hidden");   // the chips describe the bundled lessons, not this file
      // No sentences: they belong to bundled lessons, and this file is only a word list.
      useItems(items, skipped, "from " + file.name, [{ title: file.name, items }], []);
    };
    reader.onerror = () => setStatus("Could not read that file.", true);
    reader.readAsText(file);
  });

  function refreshToggles() {
    const hearingPossible = audioIndex.size > 0;
    if (!hearingPossible) toggles.hearing = false;

    modeSwitch.dataset.active = mode;   // drives where the thumb sits
    modeButtons.forEach(btn => {
      btn.setAttribute("aria-pressed", String(btn.dataset.mode === mode));
    });
    // Practice draws no reading/hearing distinction — every row is readable and carries its
    // own play button — so the toggles that would claim otherwise come off screen entirely.
    howBlock.classList.toggle("hidden", mode === "practice");
    // Sentences sits among the scripts, which practice keeps for its columns, so it has to
    // come off on its own: the vocabulary table has no sentences to show.
    sentencesToggle.classList.toggle("hidden", mode === "practice");
    startBtn.textContent = mode === "practice" ? "Show vocabulary" : "Start";

    toggleButtons.forEach(btn => {
      const name = btn.dataset.toggle;
      btn.classList.toggle("on", toggles[name]);
      btn.disabled = name === "hearing" && !hearingPossible;
      btn.setAttribute("aria-pressed", String(Boolean(toggles[name])));
    });
    writingToggle.classList.toggle("inert", Boolean(quiz) && toggles.writing && !quiz.writeRuns());
    sentencesToggle.classList.toggle("inert", Boolean(quiz) && toggles.sentences && !quiz.sentenceRuns());

    if (mode === "practice") {
      const total = practiceGroups.reduce((n, g) => n + g.items.length, 0);
      const pickedScript = toggles.pinyin || toggles.characters;
      toggleNote.textContent = !total ? ""
        : !pickedScript ? "Pick pinyin, characters, or both."
        : total + " word" + (total === 1 ? "" : "s") + " to read through";
      toggleNote.classList.toggle("error", Boolean(total) && !pickedScript);
      startBtn.disabled = !total || !pickedScript;
      return;
    }

    if (!quiz) return;

    const typeCount = allowedDirectionKeys().size;
    const usable = typeCount ? quiz.countAvailable() : 0;
    const plural = (n, word) => n + " " + word + (n === 1 ? "" : "s");
    const parts = [];
    if (usable) parts.push(plural(typeCount, "question type") + " · " + plural(usable, "word"));
    if (quiz.writeRuns()) parts.push(quiz.writeCount + " to write");
    if (quiz.sentenceRuns()) parts.push(plural(quiz.sentenceCount, "sentence"));
    const runs = parts.length > 0;

    // Why a toggle that is on is doing nothing, so its grey state is never a mystery.
    const idle = [];
    if (toggles.writing && !toggles.characters) idle.push("Writing needs Characters");
    if (toggles.sentences && quiz.sentenceCount === 0) idle.push("no sentences in these lessons yet");

    let note;
    if (!toggles.pinyin && !toggles.characters) {
      note = "Pick pinyin, characters, or both.";
    } else if (!runs) {
      const anyWay = toggles.reading || toggles.hearing || toggles.writing || toggles.sentences;
      note = anyWay ? "No questions available with these settings." : "Pick at least one way to practise.";
    } else {
      note = parts.join(" · ");
    }
    if (idle.length && (toggles.pinyin || toggles.characters)) note += " — " + idle.join("; ");
    toggleNote.textContent = note;
    toggleNote.classList.toggle("error", !runs);
    startBtn.disabled = !runs;
  }

  toggleButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      const name = btn.dataset.toggle;
      toggles[name] = !toggles[name];
      refreshToggles();
    });
  });

  modeButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      if (mode === btn.dataset.mode) return;
      mode = btn.dataset.mode;
      // Re-run the last load rather than just repainting: a deck too thin for questions is an
      // error in test mode and perfectly fine in practice, so the status line has to be redone.
      if (lastLoad) {
        useItems(lastLoad.items, lastLoad.skipped, lastLoad.sourceLabel, lastLoad.groups, lastLoad.sentences);
      }
      else refreshToggles();
    });
  });

  lessonAllBtn.addEventListener("click", () => {
    if (selectedDecks.size === bundledDecks.length) selectedDecks.clear();
    else bundledDecks.forEach(d => selectedDecks.add(d.name));
    applyDeckSelection();
  });

  replayBtn.addEventListener("click", playCurrent);

  // Unlock audio on the first touch anywhere, in the capture phase so it runs before any
  // button handler. iOS only honours this from inside a genuine gesture.
  ["touchstart", "mousedown"].forEach(evt => {
    document.addEventListener(evt, () => player.unlock(), { capture: true, once: true });
  });

  async function loadAudioIndex() {
    try {
      const res = await fetch("audio/index.json", { cache: "no-store" });
      return res.ok ? new Set(await res.json()) : new Set();
    } catch (err) {
      return new Set();   // no audio corpus available; audio questions stay switched off
    }
  }

  async function loadStrokeIndex() {
    try {
      const res = await fetch("strokes/index.json", { cache: "no-store" });
      return res.ok ? new Map(Object.entries(await res.json())) : new Map();
    } catch (err) {
      return new Map();   // no animations available; characters stay plain text
    }
  }

  async function loadStrokeParts() {
    try {
      const res = await fetch("strokes/parts.json", { cache: "no-store" });
      if (!res.ok) return { chars: {}, parts: {} };
      const data = await res.json();
      return { chars: data.chars || {}, parts: data.parts || {} };
    } catch (err) {
      return { chars: {}, parts: {} };   // no breakdown available; the sheet drops it
    }
  }

  (async function init() {
    audioIndex = await loadAudioIndex();
    strokeIndex = await loadStrokeIndex();
    partsData = await loadStrokeParts();
    refreshToggles();
    try {
      bundledDecks = await loadBundledDecks();
      bundledDecks.forEach(d => selectedDecks.add(d.name));
      pinyinByHanzi = new Map(bundledDecks.flatMap(d => d.items.map(it => [it.hanzi, it.pinyin])));
      renderLessonChips();
      applyDeckSelection();
    } catch (err) {
      setStatus(
        "Could not load the built-in lessons. Opening this file straight from disk blocks that — " +
        "use the published site, or load a CSV manually below.", true);
    }
  })();

  function showLoadScreen() {
    player.stop();
    cancelWriting();
    quizScreen.classList.add("hidden");
    practiceScreen.classList.add("hidden");
    loadScreen.classList.remove("hidden");
    document.body.classList.remove("listing");
    window.scrollTo(0, 0);
  }

  startBtn.addEventListener("click", () => {
    // Guard before hiding the load screen: a click that fell through afterwards would leave
    // nothing on screen at all. The button is disabled in both cases, but not visibly so.
    const ready = mode === "practice"
      ? practiceGroups.some(g => g.items.length > 0)
      : Boolean(quiz);
    if (!ready) return;

    loadScreen.classList.add("hidden");
    if (mode === "practice") {
      practiceScreen.classList.remove("hidden");
      document.body.classList.add("listing");
      renderPractice();
      return;
    }
    quizScreen.classList.remove("hidden");
    renderQuestion();
  });

  quizBack.addEventListener("click", showLoadScreen);
  practiceBack.addEventListener("click", showLoadScreen);
  practiceFilter.addEventListener("input", applyFilter);

  nextBtn.addEventListener("click", () => {
    renderQuestion();
  });

  // Each recording is a full dictionary entry read aloud: a click, the syllable, silence, then
  // the definition. We never cut the files (see audio/LICENSE.txt) — instead we decode them,
  // locate the syllable, and play just that span with short fades. Starting or stopping
  // playback mid-waveform produces an audible click, which is what fades are for, and
  // scheduling through Web Audio lets syllables of one word run together without a seam.
  const player = (function () {
    const ANALYSIS_LIMIT = 1.0;   // the syllable always lands well inside the first second
    const CLICK_SKIP = 0.06;      // the recordings open with a sharp pop at ~48ms
    const WINDOW = 0.01;
    const REL_FLOOR = 0.10;       // share of this file's peak that counts as speech...
    const ABS_FLOOR = 0.012;      // ...but never below this, or quiet files mistake hiss for speech
    const ONSET_RUN = 4;          // windows that must stay loud, so the pop's tail isn't an onset
    const SILENCE_RUN = 0.12;     // this much quiet means the syllable has ended
    const MAX_SPAN = 0.9;
    const FADE = 0.012;
    const GAP = 0.04;             // between syllables of one word

    let ctx = null;
    const buffers = new Map();
    const bounds = new Map();
    let generation = 0;

    function context() {
      if (!ctx) {
        const Ctor = window.AudioContext || window.webkitAudioContext;
        if (!Ctor) return null;
        // iOS routes Web Audio through the "ambient" session, which the ring/silent switch
        // mutes — on the speaker only, so headphones still work and it looks like a bug.
        // Claiming a playback session opts out of that. Must happen before the context
        // exists, and needs iOS 17+; older versions keep obeying the switch.
        try {
          if (navigator.audioSession) navigator.audioSession.type = "playback";
        } catch (err) { /* not supported here */ }
        ctx = new Ctor();
      }
      return ctx;
    }

    // iOS keeps an AudioContext suspended until something is played from inside a real user
    // gesture. Scheduling after an async fetch doesn't qualify, so on the first touch we play
    // one silent sample synchronously, which is enough to unlock it for the rest of the session.
    function unlock() {
      const audio = context();
      if (!audio) return;
      try {
        const source = audio.createBufferSource();
        source.buffer = audio.createBuffer(1, 1, audio.sampleRate || 22050);
        source.connect(audio.destination);
        source.start(0);
      } catch (err) { /* already unlocked */ }
      if (audio.state !== "running") audio.resume();
    }

    function loadBuffer(name) {
      if (buffers.has(name)) return Promise.resolve(buffers.get(name));
      return fetch("audio/" + name + ".mp3")
        .then(res => res.arrayBuffer())
        .then(data => new Promise((resolve, reject) =>
          context().decodeAudioData(data, resolve, reject)))
        .then(buffer => {
          buffers.set(name, buffer);
          return buffer;
        });
    }

    // Where the opening syllable begins and ends, measured from the decoded samples.
    function speechBounds(name, buffer) {
      if (bounds.has(name)) return bounds.get(name);
      const data = buffer.getChannelData(0);
      const rate = buffer.sampleRate;
      const limit = Math.min(data.length, Math.floor(rate * ANALYSIS_LIMIT));
      const step = Math.floor(rate * WINDOW);
      const from = Math.floor(rate * CLICK_SKIP);

      const energies = [];
      for (let i = from; i < limit; i += step) {
        let sum = 0;
        const stop = Math.min(i + step, limit);
        for (let j = i; j < stop; j++) sum += data[j] * data[j];
        energies.push(Math.sqrt(sum / (stop - i)));
      }

      const peak = energies.reduce((a, b) => Math.max(a, b), 0);
      const floor = Math.max(peak * REL_FLOOR, ABS_FLOOR);
      const runLength = Math.ceil(SILENCE_RUN / WINDOW);

      // The syllable starts where loudness *stays* up: recordings vary from speaking
      // immediately after the pop to a quarter-second of silence first.
      let first = -1;
      for (let i = 0; i + ONSET_RUN <= energies.length; i++) {
        let sustained = true;
        for (let k = 0; k < ONSET_RUN; k++) {
          if (energies[i + k] < floor) { sustained = false; break; }
        }
        if (sustained) { first = i; break; }
      }
      if (first < 0) first = 0;

      let last = first;
      let quiet = 0;
      for (let i = first; i < energies.length; i++) {
        if (energies[i] >= floor) {
          last = i;
          quiet = 0;
        } else if (++quiet >= runLength) {
          break;
        }
      }

      const start = CLICK_SKIP + Math.max(0, first - 1) * WINDOW;
      const end = CLICK_SKIP + (last + 1) * WINDOW;
      const result = { start, duration: Math.min(MAX_SPAN, Math.max(0.2, end - start)) };
      bounds.set(name, result);
      return result;
    }

    function playSequence(files, onError) {
      const mine = ++generation;
      const audio = context();
      if (!audio) {
        if (onError) onError("no-webaudio");
        return;
      }
      unlock();
      const ready = audio.state === "running"
        ? Promise.resolve()
        : Promise.resolve(audio.resume()).catch(() => {});

      Promise.all([ready].concat(files.map(loadBuffer))).then(results => {
        const loaded = results.slice(1);
        if (mine !== generation) return;
        let when = audio.currentTime + 0.04;
        loaded.forEach((buffer, i) => {
          const { start, duration } = speechBounds(files[i], buffer);
          const source = audio.createBufferSource();
          const gain = audio.createGain();
          source.buffer = buffer;
          source.connect(gain).connect(audio.destination);
          gain.gain.setValueAtTime(0, when);
          gain.gain.linearRampToValueAtTime(1, when + FADE);
          gain.gain.setValueAtTime(1, when + duration - FADE);
          gain.gain.linearRampToValueAtTime(0, when + duration);
          source.start(when, start, duration);
          when += duration + GAP;
        });
      }).catch(err => {
        if (onError) onError(String((err && err.message) || err || "playback failed"));
      });
    }

    return { playSequence, unlock, stop() { generation++; } };
  })();

  // ---------- Practice: the selected lessons as a vocabulary table ----------
  // The rendered rows, grouped as they appear on screen, so filtering can hide a lesson's
  // heading once none of its words match.
  let practiceDom = [];

  // Matching ignores tone marks, so typing "hao" finds "hǎo" — nobody types the marks.
  function foldForSearch(text) {
    let out = "";
    for (const ch of text.normalize("NFD")) {
      const code = ch.codePointAt(0);
      if (code >= 0x0300 && code <= 0x036f) continue;   // the combining tone marks
      out += ch;
    }
    return out.toLowerCase();
  }

  function vocabCell(className, text) {
    const td = document.createElement("td");
    td.className = className;
    td.textContent = text;
    return td;
  }

  /** '早' -> '65e9': the codepoint in hex, which is also the animation's filename. */
  function strokeKey(char) {
    return char.codePointAt(0).toString(16).padStart(4, "0");
  }

  /** The characters of a word that have an animation, deduplicated, in order. */
  function writableChars(hanzi) {
    return Array.from(new Set(hanzi)).filter(c => strokeIndex.has(strokeKey(c)));
  }

  function renderPractice() {
    const showHanzi = toggles.characters;
    const showPinyin = toggles.pinyin;
    const columns = 2 + (showHanzi ? 1 : 0) + (showPinyin ? 1 : 0);

    practiceDom = [];
    vocabList.textContent = "";
    const table = document.createElement("table");
    table.className = "vocab";

    for (const group of practiceGroups) {
      if (group.items.length === 0) continue;
      const headRow = document.createElement("tr");
      headRow.className = "group-row";   // the narrow layout turns word rows into grids; not this one
      const th = document.createElement("th");
      th.className = "group";
      th.colSpan = columns;
      th.textContent = group.title;
      headRow.appendChild(th);
      table.appendChild(headRow);

      const rows = [];
      for (const item of group.items) {
        const tr = document.createElement("tr");
        const files = audioIndex.size ? segmentPinyin(item.pinyin, audioIndex) : null;

        const speakCell = document.createElement("td");
        speakCell.className = "speak-cell";
        if (files) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "speak";
          btn.textContent = "🔊";
          btn.setAttribute("aria-label", "Play " + item.hanzi);
          speakCell.appendChild(btn);
          // The whole row plays, not only the button — a far bigger target for a thumb. The
          // button carries no handler of its own; the click simply bubbles up to here.
          tr.className = "playable";
          tr.addEventListener("click", () => playWord(files));
        } else {
          // 16 syllables were never recorded, so some words are reading-only. Show which,
          // rather than a button that silently does nothing.
          const silent = document.createElement("span");
          silent.className = "speak silent";
          silent.textContent = "🔇";
          silent.title = "No recording for this word";
          speakCell.appendChild(silent);
        }
        // Writing is a second verb on the word, beside listening, rather than the
        // characters themselves being tappable: a word is usually two characters, and
        // making each one a button forced gaps between them that Chinese does not have.
        const writable = writableChars(item.hanzi);
        if (writable.length) {
          const write = document.createElement("button");
          write.type = "button";
          write.className = "write";
          write.textContent = "✏️";
          write.setAttribute("aria-label", "How to write " + item.hanzi);
          write.addEventListener("click", event => {
            // The row plays the word; without this, writing practice would open on top of
            // audio nobody asked for.
            event.stopPropagation();
            openStrokes(item, writable[0]);
          });
          speakCell.appendChild(write);
        } else {
          // Same reasoning as the muted speaker: show which words have no animation rather
          // than offer a button that does nothing.
          const noWrite = document.createElement("span");
          noWrite.className = "write silent";
          noWrite.textContent = "✏️";
          noWrite.title = "No stroke data for this word";
          speakCell.appendChild(noWrite);
        }

        tr.appendChild(speakCell);
        if (showHanzi) tr.appendChild(vocabCell("hanzi", item.hanzi));
        if (showPinyin) tr.appendChild(vocabCell("pinyin", item.pinyin));
        tr.appendChild(vocabCell("meaning", item.meaning));
        table.appendChild(tr);
        rows.push({
          tr,
          haystack: foldForSearch(item.hanzi + " " + item.pinyin + " " + item.meaning),
          hasAudio: Boolean(files),
        });
      }
      practiceDom.push({ headRow, rows });
    }

    vocabList.appendChild(table);
    applyFilter();
  }

  function applyFilter() {
    const query = foldForSearch(practiceFilter.value.trim());
    let shown = 0;
    let total = 0;
    let withAudio = 0;

    for (const group of practiceDom) {
      let anyVisible = false;
      for (const row of group.rows) {
        const visible = query === "" || row.haystack.indexOf(query) >= 0;
        row.tr.classList.toggle("hidden", !visible);
        total++;
        if (row.hasAudio) withAudio++;
        if (visible) {
          shown++;
          anyVisible = true;
        }
      }
      group.headRow.classList.toggle("hidden", !anyVisible);
    }

    practiceStatus.textContent = query
      ? shown + " of " + total + " words"
      : total + " words · " + withAudio + " with audio";
    practiceStatus.classList.toggle("error", query !== "" && shown === 0);
  }

  function playWord(files) {
    player.stop();
    practiceStatus.classList.remove("error");
    player.playSequence(files, reason => {
      // Same reasoning as the quiz: a play button that silently does nothing is impossible
      // to diagnose from the outside.
      practiceStatus.textContent = "Audio failed: " + reason;
      practiceStatus.classList.add("error");
    });
  }

  // ---------- Stroke order: the animation for one character ----------
  // Drawn by Hanzi Writer from the outlines in strokes/data/, both vendored into the repo
  // by tools/fetch_strokes.py. Vectors rather than the watermarked GIFs this used to show:
  // they take the app's own colours, stay sharp at any size, and weigh a tenth as much.
  const STROKE_BOX = 280;           // the square the outlines are drawn in
  let sheetChar = "";
  let writer = null;

  // Created with a real character, never a placeholder: Hanzi Writer asks the loader for
  // whatever it is given straight away, and "" has no codepoint to build a filename from.
  function makeWriter(char) {
    return HanziWriter.create(strokeTarget, char, {
      width: STROKE_BOX,
      height: STROKE_BOX,
      padding: 16,
      showCharacter: false,
      showOutline: true,
      strokeColor: "#e8ecf1",       // --text: the ink
      outlineColor: "#333c4d",      // the ghost of the finished character
      radicalColor: "#4f8cff",      // --accent: which part is the radical, for free
      strokeAnimationSpeed: 1,
      delayBetweenStrokes: 260,
      delayBetweenLoops: 1400,      // the beat on the finished character before it redraws
      charDataLoader: loadStrokeData,
    });
  }

  // Local files only. Without this Hanzi Writer fetches from a CDN, which is exactly the
  // dependency this directory exists to avoid.
  function loadStrokeData(requested, onLoad, onError) {
    if (!requested || requested.codePointAt(0) === undefined) {
      onError(new Error("no character"));
      return;
    }
    fetch("strokes/data/" + strokeKey(requested) + ".json")
      .then(res => res.ok ? res.json() : Promise.reject(new Error(res.status)))
      .then(onLoad)
      .catch(onError);
  }

  // ---------- What the character is made of ----------
  // Built from strokes/parts.json, which tools/fetch_strokes.py extracts from Make Me a
  // Hanzi. Three things, in the order they help: the components, each glossed; which one
  // carries the meaning and which one carries the sound, where the character is one of the
  // phono-semantic majority; and the one-line story, where the character has one.
  //
  // 謝 is not seventeen strokes to memorise — it is 言 'speech' plus 射, which is there for
  // its sound. That is the sentence this block exists to put on the screen.

  /** One row: the component, its pinyin and gloss, and what it is doing in the character. */
  function partRow(component, entry) {
    const part = partsData.parts[component] || {};
    const row = document.createElement("div");
    row.className = "part";

    const char = document.createElement("span");
    char.className = "part-char" + (component === entry.radical ? " radical" : "");
    char.textContent = component;
    row.appendChild(char);

    const text = document.createElement("span");
    text.className = "part-text";
    // 青 qīng under 請 qǐng is the whole point of a phonetic component, so the sound is
    // worth showing for every part that has one, not only the phonetic.
    text.textContent = [part.pinyin, part.gloss].filter(Boolean).join(" · ");
    row.appendChild(text);

    // Meaning and sound are what a learner can use; 'radical' is a dictionary fact, so it
    // only gets the label when there is nothing more useful to say about that part.
    const role = component === entry.semantic ? "meaning"
      : component === entry.phonetic ? "sound"
      : component === entry.radical ? "radical" : "";
    if (role) {
      const tag = document.createElement("span");
      tag.className = "part-role";
      tag.textContent = role;
      row.appendChild(tag);
    }
    return row;
  }

  function showParts(char) {
    const entry = partsData.chars[strokeKey(char)];
    partsBox.textContent = "";
    partsBox.classList.toggle("hidden", !entry);
    if (!entry) return;

    if (entry.parts) {
      const head = document.createElement("div");
      head.className = "parts-head";
      const label = document.createElement("span");
      label.textContent = "Made of";
      head.appendChild(label);
      // The blue row matches the blue strokes in the animation above; saying which is
      // which costs four words and saves the guess.
      if (entry.radical) {
        const legend = document.createElement("span");
        legend.className = "parts-legend";
        legend.textContent = "blue is the radical";
        head.appendChild(legend);
      }
      partsBox.appendChild(head);
      for (const component of entry.parts) partsBox.appendChild(partRow(component, entry));
    }

    if (entry.hint) {
      const hint = document.createElement("p");
      hint.className = "parts-hint";
      hint.textContent = entry.hint;
      partsBox.appendChild(hint);
    }
  }

  function showStrokeChar(char) {
    sheetChar = char;
    const strokes = strokeIndex.get(strokeKey(char));
    strokeCount.textContent = strokes === 1 ? "1 stroke" : strokes + " strokes";
    strokeTarget.setAttribute("aria-label", "Stroke order for " + char);
    showParts(char);
    Array.from(strokeChars.children).forEach(btn => {
      btn.setAttribute("aria-pressed", String(btn.textContent === char));
    });

    if (!writer) writer = makeWriter(char);
    writer.setCharacter(char)
      .then(() => {
        // The SVG is created at a fixed size; a viewBox lets it shrink with the sheet on a
        // narrow phone instead of overflowing it.
        const svg = strokeTarget.querySelector("svg");
        if (svg && !svg.getAttribute("viewBox")) {
          svg.setAttribute("viewBox", "0 0 " + STROKE_BOX + " " + STROKE_BOX);
          svg.removeAttribute("width");
          svg.removeAttribute("height");
        }
        if (sheetChar === char) writer.loopCharacterAnimation();
      })
      .catch(() => {
        // Only reachable if strokes/data/ is incomplete, which means the page was published
        // without running the fetch tool. Say so rather than showing an empty square.
        strokeCount.textContent = "No stroke data for " + char;
      });
  }

  function openStrokes(item, char) {
    strokeTitle.textContent = item.hanzi;
    strokeWordSub.textContent = item.pinyin + " · " + item.meaning;

    // Stepping 你 → 好 without closing the sheet is the point of the strip; for a
    // single-character word it would just repeat the heading, so it stays hidden. Doubled
    // words — 謝謝, 太太 — dedupe to one button, since two identical ones would suggest
    // the second character is written differently.
    const chars = Array.from(new Set(item.hanzi)).filter(c => strokeIndex.has(strokeKey(c)));
    strokeChars.textContent = "";
    strokeChars.classList.toggle("hidden", chars.length < 2);
    if (chars.length >= 2) {
      for (const c of chars) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "sheet-char";
        btn.textContent = c;
        btn.addEventListener("click", () => showStrokeChar(c));
        strokeChars.appendChild(btn);
      }
    }

    const files = audioIndex.size ? segmentPinyin(item.pinyin, audioIndex) : null;
    strokeSay.classList.toggle("hidden", !files);
    strokeSay.onclick = files ? () => playWord(files) : null;

    // Opened before the drawing starts, so a character whose data failed to load still
    // shows a sheet saying as much instead of nothing happening at all.
    strokeSheet.showModal();
    showStrokeChar(char);
  }

  strokeClose.addEventListener("click", () => strokeSheet.close());
  // Restarting the loop rather than playing once, so the sheet keeps behaving the same way
  // whether or not you touched it.
  strokeReplay.addEventListener("click", () => { if (writer) writer.loopCharacterAnimation(); });
  // Tapping the drawing itself is the most obvious way to ask for it again.
  strokeTarget.addEventListener("click", () => { if (writer) writer.loopCharacterAnimation(); });

  // A sheet is expected to dismiss when you tap the dimmed area beside it. The dialog's own
  // box is exactly the sheet, so a click that lands on the dialog node and not on its
  // contents came from the backdrop.
  strokeSheet.addEventListener("click", event => {
    if (event.target === strokeSheet) strokeSheet.close();
  });

  strokeSheet.addEventListener("keydown", event => {
    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
    const chars = Array.from(strokeChars.children).map(btn => btn.textContent);
    if (chars.length < 2) return;
    event.preventDefault();
    const step = event.key === "ArrowRight" ? 1 : -1;
    const at = chars.indexOf(sheetChar);
    showStrokeChar(chars[(at + step + chars.length) % chars.length]);
  });

  strokeSheet.addEventListener("close", () => {
    // The loop would otherwise keep animating behind a shut dialog, burning battery on a
    // phone to draw something nobody can see.
    if (writer) writer.pauseAnimation();
    player.stop();
  });

  let currentQuestion = null;

  function renderQuestion() {
    const q = quiz.nextQuestion();
    if (!q) return;
    currentQuestion = q;
    player.stop();
    cancelWriting();

    // Every kind starts from a bare card and switches on only what it uses.
    promptSubEl.classList.add("hidden");
    replayBtn.classList.add("hidden");
    [sentenceLine, tileBank, sentenceResult].forEach(el => {
      el.classList.add("hidden");
      el.classList.remove("right", "wrong");
      el.textContent = "";
    });
    writeArea.classList.add("hidden");
    optionsEl.innerHTML = "";
    checkBtn.classList.add("hidden");
    nextBtn.classList.add("hidden");

    if (q.kind === "write") renderWrite(q);
    else if (q.kind === "order") renderOrder(q);
    else if (q.kind === "gap") renderGap(q);
    else renderWord(q);
  }

  function renderWord(q) {
    promptLabelEl.textContent = q.promptLabel;
    promptValueEl.textContent = q.mode === "audio" ? "\u{1F50A}" : q.promptValue;
    promptValueEl.classList.toggle("latin", q.mode !== "audio" && !q.promptIsHanzi);
    replayBtn.classList.toggle("hidden", q.mode !== "audio");
    q.options.forEach(value => addOption(value, document.createTextNode(value), q));
    if (q.mode === "audio") playCurrent();
  }

  // The value travels with the button rather than being read back from its text: a sentence
  // option can hold characters and pinyin stacked, and its text would no longer match.
  function addOption(value, content, q) {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.dataset.value = value;
    btn.appendChild(content);
    btn.addEventListener("click", () => handleAnswer(value, q));
    optionsEl.appendChild(btn);
  }

  function playCurrent() {
    if (!currentQuestion || !currentQuestion.audioFiles) return;
    replayBtn.textContent = currentQuestion.kind === "write" ? "\u{1F50A} Hear it" : "Play again";
    player.playSequence(currentQuestion.audioFiles, reason => {
      // Surface it rather than failing silently — a mute button is impossible to diagnose.
      replayBtn.textContent = "Audio failed: " + reason;
    });
  }

  function handleAnswer(selected, q) {
    const correct = q.correctValue;
    Array.from(optionsEl.querySelectorAll(".option-btn")).forEach(btn => {
      btn.disabled = true;
      if (btn.dataset.value === correct) {
        btn.classList.add(selected === correct ? "correct" : "reveal");
      } else if (btn.dataset.value === selected) {
        btn.classList.add("incorrect");
      }
    });
    if (q.kind === "gap") {
      // Put the answer into the line, so the sentence is read whole once before moving on.
      const blank = sentenceLine.querySelector(".blank");
      if (blank) {
        const filled = wordFace(q.gap.word, sentencePinyin(q.sentence, q.gap.word));
        filled.classList.add("filled");
        blank.replaceWith(filled);
      }
    } else if (q.mode === "audio") {
      // Reveal what was actually said — otherwise a wrong answer teaches nothing.
      promptValueEl.textContent = q.row.hanzi + "  " + q.row.pinyin;
      promptValueEl.classList.add("latin");
    }
    nextBtn.classList.remove("hidden");
  }

  // ---------- Sentences: Order and Gap ----------
  // A word is shown the way the script toggles say — characters, pinyin, or both stacked —
  // exactly as practice shows its columns, so Pinyin alone drills word order before reading.
  function wordFace(hanzi, pinyin) {
    const face = document.createElement("span");
    face.className = "face";
    if (toggles.characters) {
      const h = document.createElement("span");
      h.className = "face-hanzi";
      h.textContent = hanzi;
      face.appendChild(h);
    }
    if (toggles.pinyin) {
      const p = document.createElement("span");
      p.className = "face-pinyin";
      p.textContent = pinyin;
      face.appendChild(p);
    }
    return face;
  }

  // What the learner can actually see of a word. Answers are compared on this, not on the
  // characters: with pinyin alone 他 and 她 are both "tā", and swapping two tiles that look
  // identical cannot be a mistake.
  function faceKey(hanzi, pinyin) {
    return (toggles.characters ? hanzi : "") + "/" + (toggles.pinyin ? pinyin.toLowerCase() : "");
  }

  // A word of the sentence carries its own pinyin; any other (a wrong option) is looked up
  // across every deck, and a number, which no deck lists whole, is read digit by digit.
  function sentencePinyin(sentence, hanzi) {
    const at = sentence.tokens.indexOf(hanzi);
    if (at >= 0) return sentence.pinyin[at];
    if (pinyinByHanzi.has(hanzi)) return pinyinByHanzi.get(hanzi);
    const digits = Array.from(hanzi).map(c => pinyinByHanzi.get(c));
    return digits.every(Boolean) ? digits.join("") : "";
  }

  function facesRow(sentence, tokens) {
    const row = document.createElement("div");
    row.className = "faces";
    tokens.forEach(t => row.appendChild(wordFace(t, sentencePinyin(sentence, t))));
    if (sentence.end) {
      const end = document.createElement("span");
      end.className = "end";
      end.textContent = sentence.end;
      row.appendChild(end);
    }
    return row;
  }

  function renderOrder(q) {
    const s = q.sentence;
    promptLabelEl.textContent = "Put the words in order";
    promptValueEl.textContent = s.english;
    promptValueEl.classList.add("latin");

    const keyOf = tokens => tokens.map(t => faceKey(t, sentencePinyin(s, t))).join(" ");
    const mainKey = keyOf(s.tokens);
    const accepted = new Set([mainKey].concat(s.also.map(keyOf)));

    // Never deal the tiles already in an accepted order. The validator guarantees some other
    // arrangement exists; the cap only matters if hiding a script collapses them all into
    // one look, and then any deal is as good as another.
    const indices = s.tokens.map((_, i) => i);
    let deal = shuffled(indices);
    for (let attempt = 0; attempt < 50 && accepted.has(keyOf(deal.map(i => s.tokens[i]))); attempt++) {
      deal = shuffled(indices);
    }

    const placed = [];
    let checked = false;

    function tile(i) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tile";
      btn.appendChild(wordFace(s.tokens[i], s.pinyin[i]));
      btn.addEventListener("click", () => {
        if (checked) return;
        const at = placed.indexOf(i);
        if (at >= 0) placed.splice(at, 1);
        else placed.push(i);
        draw();
      });
      return btn;
    }

    function draw() {
      sentenceLine.textContent = "";
      placed.forEach(i => sentenceLine.appendChild(tile(i)));
      if (s.end) {
        const end = document.createElement("span");
        end.className = "end";
        end.textContent = s.end;
        sentenceLine.appendChild(end);
      }
      tileBank.textContent = "";
      deal.filter(i => placed.indexOf(i) < 0).forEach(i => tileBank.appendChild(tile(i)));
      checkBtn.disabled = placed.length < s.tokens.length;
    }

    checkBtn.onclick = () => {
      if (checked || placed.length < s.tokens.length) return;
      checked = true;
      const key = keyOf(placed.map(i => s.tokens[i]));
      const right = accepted.has(key);
      sentenceLine.classList.add(right ? "right" : "wrong");
      // Wrong: show the sentence. Right by another order: show the main one too, since seeing
      // both is what teaches that the position is free.
      if (!right || key !== mainKey) {
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = right ? "Also right:" : "The sentence:";
        sentenceResult.appendChild(label);
        sentenceResult.appendChild(facesRow(s, s.tokens));
        sentenceResult.classList.remove("hidden");
      }
      tileBank.classList.add("hidden");
      checkBtn.classList.add("hidden");
      nextBtn.classList.remove("hidden");
    };

    sentenceLine.classList.remove("hidden");
    tileBank.classList.remove("hidden");
    checkBtn.classList.remove("hidden");
    draw();
  }

  function renderGap(q) {
    const s = q.sentence;
    promptLabelEl.textContent = "Fill the gap";
    promptValueEl.textContent = s.english;
    promptValueEl.classList.add("latin");

    s.tokens.forEach((t, i) => {
      if (t === q.gap.word) {
        const blank = document.createElement("span");
        blank.className = "blank";
        sentenceLine.appendChild(blank);
      } else {
        sentenceLine.appendChild(wordFace(t, s.pinyin[i]));
      }
    });
    if (s.end) {
      const end = document.createElement("span");
      end.className = "end";
      end.textContent = s.end;
      sentenceLine.appendChild(end);
    }
    sentenceLine.classList.remove("hidden");
    q.options.forEach(value => addOption(value, wordFace(value, sentencePinyin(s, value)), q));
  }

  // ---------- Write: draw the word, stroke by stroke ----------
  // Graded by Hanzi Writer's quiz: each stroke must be the next one, drawn the right way,
  // starting and ending about where it should. See "Write" in SPEC.md, and the calibration
  // test there for where WRITE_LENIENCY comes from.
  const WRITE_LENIENCY = 1.0;
  let quizWriter = null;
  // Bumped on every new word and on leaving, so callbacks from an abandoned quiz do nothing.
  let writeRun = 0;
  let writeState = null;

  function fitSvg(target) {
    const svg = target.querySelector("svg");
    if (svg && !svg.getAttribute("viewBox")) {
      svg.setAttribute("viewBox", "0 0 " + STROKE_BOX + " " + STROKE_BOX);
      svg.removeAttribute("width");
      svg.removeAttribute("height");
    }
  }

  function cancelWriting() {
    writeRun++;
    if (quizWriter) quizWriter.cancelQuiz();
  }

  function renderWrite(q) {
    promptLabelEl.textContent = "Write this word";
    promptValueEl.textContent = q.row.meaning;
    promptValueEl.classList.add("latin");
    promptSubEl.textContent = q.row.pinyin;
    promptSubEl.classList.remove("hidden");
    // Hearing it helps; it is never the only clue, since homophones would make that ambiguous.
    replayBtn.classList.toggle("hidden", !(toggles.hearing && q.audioFiles));
    replayBtn.textContent = "\u{1F50A} Hear it";

    writeDone.textContent = "";
    writeResult.textContent = "";
    writeResult.classList.remove("clean");
    writeShow.classList.remove("hidden");
    writeArea.classList.remove("hidden");

    writeState = {
      run: writeRun,
      chars: Array.from(q.row.hanzi),   // 謝謝 is drawn twice: it is written twice
      at: 0,
      nextStroke: 0,
      mistakes: [],
      shown: false,
      finished: false,
    };
    startChar();
  }

  function startChar() {
    const state = writeState;
    const char = state.chars[state.at];
    state.nextStroke = 0;
    state.mistakes[state.at] = 0;
    // One writer for the whole session, recharged per character: every HanziWriter.create()
    // leaves listeners on the document that are never removed.
    if (!quizWriter) {
      quizWriter = HanziWriter.create(writeTarget, char, {
        width: STROKE_BOX,
        height: STROKE_BOX,
        padding: 16,
        showCharacter: false,
        showOutline: false,             // with the outline it is tracing, not recall
        strokeColor: "#e8ecf1",
        radicalColor: null,
        highlightColor: "#4f8cff",      // the hint after three misses
        drawingColor: "#8893a3",
        drawingWidth: 6,
        strokeAnimationSpeed: 1.4,
        charDataLoader: loadStrokeData,
      });
    }
    quizWriter.setCharacter(char).then(() => {
      if (state.run !== writeRun) return;
      fitSvg(writeTarget);
      quizWriter.quiz({
        leniency: WRITE_LENIENCY,
        showHintAfterMisses: 3,
        onCorrectStroke: data => {
          if (state.run === writeRun) state.nextStroke = data.strokeNum + 1;
        },
        onComplete: summary => {
          if (state.run !== writeRun || state.shown) return;
          state.mistakes[state.at] = summary.totalMistakes;
          finishChar();
        },
      });
    }).catch(() => {
      if (state.run === writeRun) writeResult.textContent = "No stroke data for " + char;
    });
  }

  function addDone(char, shown) {
    const span = document.createElement("span");
    span.textContent = char;
    if (shown) span.className = "shown";
    writeDone.appendChild(span);
  }

  function finishChar() {
    const state = writeState;
    addDone(state.chars[state.at], state.shown);
    state.at++;
    if (state.at < state.chars.length && !state.shown) {
      startChar();
      return;
    }
    // Show me hands over the rest of the word as well, so it reads complete.
    while (state.at < state.chars.length) addDone(state.chars[state.at++], true);
    state.finished = true;
    writeShow.classList.add("hidden");

    const total = state.mistakes.reduce((a, b) => a + (b || 0), 0);
    if (state.shown) {
      writeResult.textContent = "Shown";
    } else if (total === 0) {
      writeResult.textContent = "Clean";
      writeResult.classList.add("clean");
    } else {
      const which = state.chars.filter((_, i) => state.mistakes[i] > 0);
      writeResult.textContent =
        total + (total === 1 ? " mistake" : " mistakes") +
        (state.chars.length > 1 ? " — in " + which.join(", ") : "");
    }
    nextBtn.classList.remove("hidden");
  }

  // Give up on this word: draw the rest of the current character from where the learner
  // stopped — not from stroke 1, which would throw away what they got right.
  writeShow.addEventListener("click", async () => {
    const state = writeState;
    if (!state || state.finished || state.shown || state.run !== writeRun) return;
    state.shown = true;
    quizWriter.cancelQuiz();
    const strokes = Number(strokeIndex.get(strokeKey(state.chars[state.at]))) || 0;
    for (let i = state.nextStroke; i < strokes; i++) {
      await quizWriter.animateStroke(i);
      if (state.run !== writeRun) return;
    }
    finishChar();
  });
})();
</script>
</body>
</html>
