<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chayniz</title>
<style>
  :root {
    --bg: #11151c;
    --panel: #1b212c;
    --text: #e8ecf1;
    --muted: #8893a3;
    --accent: #4f8cff;
    --good: #2fbf71;
    --bad: #e2543a;
    --border: #2a3140;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh; /* mobile browsers: avoids the toolbar-overlap gap 100vh leaves */
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
    text-align: center;
  }
  .subtitle {
    color: var(--muted);
    text-align: center;
    font-size: 0.9rem;
    margin: 0 0 24px;
  }
  .file-row {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  .secondary-btn {
    width: 100%;
    padding: 14px;
    background: #232b38;
    color: var(--text);
    border: 1px solid var(--border);
    font-size: 1rem;
  }
  .toggle-group {
    margin-top: 4px;
  }
  .toggle-label {
    color: var(--muted);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .toggle-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .toggle {
    flex: 1;
    padding: 12px 8px;
    background: #232b38;
    color: var(--muted);
    border: 1px solid var(--border);
    font-size: 0.95rem;
  }
  /* Lesson chips size to their text and wrap, so the row stays usable as lessons accumulate. */
  #lesson-row { flex-wrap: wrap; }
  #lesson-row .toggle { flex: 0 1 auto; min-width: 86px; }
  .toggle.on {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 600;
  }
  .toggle:disabled {
    opacity: 0.35;
  }
  .own-csv {
    margin-top: 8px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .own-csv > summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 0.85rem;
    list-style: none;
  }
  .own-csv > summary::-webkit-details-marker { display: none; }
  .own-csv > summary::after { content: " ▾"; }
  .own-csv[open] > summary::after { content: " ▴"; }
  .own-csv > *:not(summary) { margin-top: 10px; }
  .status {
    font-size: 0.9rem;
    color: var(--muted);
    min-height: 1.2em;
  }
  .status.error { color: var(--bad); }
  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 12px;
  }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .primary-btn {
    width: 100%;
    padding: 16px;
    background: var(--accent);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 600;
    margin-top: 8px;
  }
  .prompt-label {
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
    margin-bottom: 4px;
  }
  .prompt-value {
    font-size: 2.2rem;
    text-align: center;
    margin: 0 0 24px;
    word-break: break-word;
  }
  .prompt-value.latin {
    font-size: 1.5rem;
  }
  .replay-btn {
    display: block;
    margin: -12px auto 20px;
    padding: 10px 20px;
    background: #232b38;
    color: var(--text);
    border: 1px solid var(--border);
    font-size: 0.95rem;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option-btn {
    width: 100%;
    padding: 16px;
    background: #232b38;
    color: var(--text);
    font-size: 1.1rem;
    text-align: left;
    border: 1px solid var(--border);
  }
  .option-btn:active {
    background: #2c3647;
  }
  .option-btn.correct {
    background: var(--good);
    color: #06230f;
    border-color: var(--good);
  }
  .option-btn.incorrect {
    background: var(--bad);
    color: #2a0a04;
    border-color: var(--bad);
  }
  .option-btn.reveal {
    background: var(--good);
    color: #06230f;
    border-color: var(--good);
  }
  .next-row {
    margin-top: 20px;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    padding: 12px;
  }
  /* Two equal buttons read as two buttons, not as one two-state control. A single track with
     a thumb that slides between halves says "one of these, currently that one" at a glance,
     while keeping each half a full-size tap target. */
  .mode-switch {
    position: relative;
    display: flex;
    background: #232b38;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 14px;
  }
  .mode-thumb {
    position: absolute;
    top: 4px;
    bottom: 4px;
    left: 4px;
    width: calc(50% - 4px);
    background: var(--accent);
    border-radius: 9px;
    transition: transform 0.18s ease;
  }
  .mode-switch[data-active="test"] .mode-thumb { transform: translateX(100%); }
  .mode-opt {
    position: relative;   /* keeps the labels above the thumb */
    z-index: 1;
    flex: 1;
    padding: 12px 8px;
    background: transparent;
    border: none;
    border-radius: 9px;
    color: var(--muted);
    font-size: 0.95rem;
    transition: color 0.18s ease;
  }
  .mode-opt[aria-pressed="true"] {
    color: #fff;
    font-weight: 600;
  }
  @media (prefers-reduced-motion: reduce) {
    .mode-thumb, .mode-opt { transition: none; }
  }
  /* The vocabulary table is a long scrolling list, so the centred single-card layout
     that suits the quiz would push its top off screen. */
  .card.wide { max-width: 620px; }
  body.listing main { justify-content: flex-start; }
  .screen-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .back-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 8px 12px;
    font-size: 0.9rem;
  }
  .back-btn:active { background: #232b38; }
  .screen-title {
    color: var(--muted);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .label-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .link-btn {
    background: transparent;
    color: var(--accent);
    border: none;
    padding: 0 2px;
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .filter-input {
    width: 100%;
    padding: 12px 14px;
    background: #232b38;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    font: inherit;
    margin-bottom: 10px;
  }
  .filter-input::placeholder { color: var(--muted); }
  table.vocab {
    width: 100%;
    border-collapse: collapse;
    margin-top: 14px;
  }
  .vocab th.group {
    text-align: left;
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 20px 0 6px;
  }
  .vocab tr:first-child th.group { padding-top: 0; }
  .vocab td {
    padding: 11px 6px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  /* Both buttons stay on one line; the cell shrinks to fit them. */
  .vocab td.speak-cell {
    width: 1%;
    white-space: nowrap;
    padding-left: 0;
    padding-right: 10px;
  }
  .vocab td.hanzi { font-size: 1.35rem; white-space: nowrap; }
  .vocab td.pinyin { white-space: nowrap; }
  .vocab td.meaning {
    color: var(--muted);
    font-size: 0.95rem;
    overflow-wrap: break-word;
  }

  /* Four columns and two buttons do not fit across a phone. Squeezing them produced
     Zhōngguórén split mid-syllable and 中國人 stacked one character per line, which is worse
     than the sideways scroll it fixed — so below 520px the row stops being four columns and
     becomes a small grid: what you are learning on the first line, what it means underneath.
     The english gets a whole line to wrap in, and nothing else has to break at all. */
  @media (max-width: 520px) {
    .card { padding: 16px; }
    table.vocab, .vocab tbody, .vocab tr, .vocab td, .vocab th { display: block; }
    .vocab tr {
      display: grid;
      grid-template-columns: auto auto 1fr;
      grid-template-areas:
        "btns hanzi pinyin"
        "btns english english";
      align-items: center;
      column-gap: 10px;
      row-gap: 2px;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }
    /* The lesson heading is a row too, but not a word — it keeps the plain block flow. */
    .vocab tr.group-row {
      display: block;
      border-bottom: none;
      padding: 0;
    }
    .vocab td {
      border-bottom: none;
      padding: 0;
    }
    .vocab td.speak-cell {
      grid-area: btns;
      width: auto;
      padding: 0;
    }
    .vocab td.hanzi { grid-area: hanzi; font-size: 1.3rem; }
    .vocab td.pinyin { grid-area: pinyin; }
    .vocab td.meaning { grid-area: english; }
    .speak, .write { padding: 6px 8px; }
    .write { margin-left: 5px; }
  }
  .speak {
    background: #232b38;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 9px;
    font-size: 1rem;
    line-height: 1;
  }
  .speak:active { background: #2c3647; }
  /* 16 syllables were never recorded by the MOE, so some words are reading-only. A dimmed
     muted-speaker glyph says which, and keeps the column aligned. */
  .speak.silent {
    opacity: 0.3;
    cursor: default;
  }
  tr.playable { cursor: pointer; }
  tr.playable:active td { background: #222a36; }

  /* Writing sits beside listening as a second verb on the word, matching the speaker in
     size and shape so the pair reads as one control group. */
  .write {
    background: #232b38;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 8px;
    font-size: 1rem;
    line-height: 1;
    margin-left: 5px;
  }
  .write:active { background: #2c3647; }
  .write.silent {
    opacity: 0.3;
    cursor: default;
  }

  /* The stroke sheet is a <dialog>, which brings the focus trap, Esc-to-close and an inert
     background with it — none of that is worth reimplementing on an overlay div. It rises
     from the bottom edge on a phone, where a thumb is, and settles into a centred card on
     a wider screen. Either way it is a detail about the thing you tapped, so it dims the
     page behind rather than replacing it. */
  .sheet {
    width: 100%;
    max-width: 420px;
    margin: auto auto 0;           /* auto sides, pinned to the bottom edge */
    padding: 0;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 20px 20px 0 0;
    background: var(--panel);
    color: var(--text);
    max-height: 92dvh;
    overflow: visible;
  }
  .sheet::backdrop {
    background: rgba(8, 10, 14, 0.62);
    backdrop-filter: blur(3px);
  }
  .sheet[open] { animation: sheet-rise 0.22s cubic-bezier(0.2, 0.8, 0.3, 1); }
  .sheet[open]::backdrop { animation: sheet-fade 0.22s ease; }
  @keyframes sheet-rise { from { transform: translateY(14px); opacity: 0; } }
  @keyframes sheet-fade { from { opacity: 0; } }
  @media (min-width: 560px) {
    .sheet {
      margin: auto;
      border-radius: 20px;
      border-bottom: 1px solid var(--border);
      max-width: 380px;
    }
    @keyframes sheet-rise { from { transform: scale(0.97); opacity: 0; } }
  }
  @media (prefers-reduced-motion: reduce) {
    .sheet[open], .sheet[open]::backdrop { animation: none; }
  }
  .sheet-body {
    padding: 10px 20px 20px;
    display: flex;
    flex-direction: column;
    max-height: 92dvh;
    overflow-y: auto;
  }
  /* The grab handle says "this came up from the bottom and goes back down" without a
     sentence of explanation. Decorative only — the close button does the work. */
  .sheet-grip {
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    margin: 0 auto 12px;
    flex: none;
  }
  @media (min-width: 560px) { .sheet-grip { display: none; } }
  .sheet-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 12px;
  }
  .sheet-word { flex: 1; min-width: 0; }
  .sheet-word-hanzi { font-size: 1.1rem; }
  .sheet-word-sub {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 2px;
    overflow-wrap: anywhere;
  }
  .sheet-close {
    flex: none;
    background: #232b38;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 10px;
    width: 34px;
    height: 34px;
    font-size: 1rem;
    line-height: 1;
  }
  .sheet-close:active { background: #2c3647; }
  /* The strokes are vectors, so the character is drawn in the app's own colours directly on
     the panel. The dashed cross is the 田字格 a workbook rules its squares with: it gives
     the eye a reference for where in the square each stroke begins. */
  .stroke-grid {
    position: relative;
    align-self: center;
    width: 100%;
    max-width: 260px;
    aspect-ratio: 1 / 1;
    background: #161b24;
    border: 1px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
  }
  .stroke-grid::before {
    content: "";
    position: absolute;
    left: 10px;
    right: 10px;
    top: 50%;
    border-top: 1px dashed var(--border);
  }
  .stroke-grid::after {
    content: "";
    position: absolute;
    top: 10px;
    bottom: 10px;
    left: 50%;
    border-left: 1px dashed var(--border);
  }
  .stroke-grid svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .sheet-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 14px;
    color: var(--muted);
    font-size: 0.85rem;
  }
  /* The breakdown under the square. Stroke count tells you how long the character takes
     to write; this tells you what it is, which is the part that makes it stick — two or
     three pieces that mean something, rather than seventeen strokes to memorise. */
  .parts {
    margin-top: 12px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .parts-head {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    color: var(--muted);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 4px;
  }
  .parts-legend { text-transform: none; letter-spacing: 0; font-size: 0.78rem; }
  .part {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 2px 0;
  }
  .part-char {
    flex: none;
    width: 1.5em;
    text-align: center;
    font-size: 1.3rem;
    line-height: 1.15;
  }
  /* Blue is already the colour the animation draws the radical in, so the row and the
     strokes it names tie together without a sentence saying so. */
  .part-char.radical { color: var(--accent); }
  .part-text {
    flex: 1;
    min-width: 0;
    font-size: 0.85rem;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  .part-role {
    flex: none;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 8px;
  }
  /* The one-line story of the character — 'A woman with a son' — which is what you will
     actually recall at the moment of writing it. */
  .parts-hint {
    margin: 6px 0 0;
    font-size: 0.88rem;
    color: var(--text);
    line-height: 1.45;
  }
  .sheet-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .sheet-btn {
    flex: 1;
    padding: 12px 10px;
    background: #232b38;
    color: var(--text);
    border: 1px solid var(--border);
    font-size: 0.95rem;
  }
  .sheet-btn:active { background: #2c3647; }
  /* Only shown for multi-character words, where stepping 你 → 好 without closing the sheet
     is the whole point. */
  .sheet-chars {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }
  .sheet-char {
    background: #232b38;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 1.15rem;
    line-height: 1.1;
  }
  .sheet-char[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  /* On, but with nothing to do under the current settings — Writing without Characters, or
     Sentences for lessons that have none yet. Still pressable, so it can be switched off. */
  .toggle.on.inert {
    background: #2a3140;
    border-color: var(--border);
    color: var(--muted);
  }

  .prompt-sub {
    color: var(--muted);
    font-size: 1.05rem;
    text-align: center;
    margin: -16px 0 20px;
  }

  /* ---------- Sentences: a word shown as its characters, its pinyin, or both stacked ---------- */
  .face {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.15;
  }
  .face-hanzi { font-size: 1.35rem; }
  .face-pinyin { font-size: 0.85rem; color: var(--muted); }
  .face-hanzi + .face-pinyin { margin-top: 2px; }
  .face-pinyin:only-child { font-size: 1.05rem; color: var(--text); }

  .sentence-line {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 6px;
    min-height: 58px;
    padding: 8px;
    margin: 0 0 16px;
    border: 1px dashed var(--border);
    border-radius: 12px;
  }
  .sentence-line.right { border: 1px solid var(--good); }
  .sentence-line.wrong { border: 1px solid var(--bad); }
  .sentence-line .end { font-size: 1.35rem; align-self: flex-end; }
  /* Fixed width whatever the answer's length, so a two-character answer isn't given away. */
  .blank {
    display: inline-block;
    width: 3.2em;
    height: 1.6em;
    border-bottom: 2px solid var(--accent);
  }
  .filled { color: var(--good); }
  .filled .face-pinyin { color: var(--good); }

  .tile-bank {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 52px;
    margin-bottom: 8px;
  }
  .tile {
    padding: 8px 12px;
    background: #232b38;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .tile:active { background: #2c3647; }
  .sentence-line .tile { background: #1f2a3c; border-color: #34507f; }
  .sentence-result {
    font-size: 0.95rem;
    margin: 0 0 8px;
  }
  .sentence-result .label { color: var(--muted); font-size: 0.85rem; display: block; margin-bottom: 6px; }
  .sentence-result .faces { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .option-btn .face { align-items: flex-start; }

  /* ---------- Write: the learner draws, so the square must not scroll the page ---------- */
  .write-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .write-done {
    display: flex;
    gap: 4px;
    font-size: 1.6rem;
    min-height: 1.9rem;
  }
  .write-done .shown { color: var(--muted); }
  .write-grid {
    max-width: 230px;
    cursor: crosshair;
    touch-action: none;
  }
  .write-actions { display: flex; gap: 10px; }
  .write-actions .secondary-btn { width: auto; padding: 10px 20px; font-size: 0.95rem; }
  .write-result { text-align: center; }
  .write-result.clean { color: var(--good); }

  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="load-screen" class="card">
    <h1>Chayniz</h1>
    <p class="subtitle">Taiwanese Mandarin drills.</p>
    <div class="file-row">
      <div id="load-status" class="status">Loading lessons…</div>

      <div class="toggle-group">
        <div class="toggle-label">Mode</div>
        <div class="mode-switch" id="mode-switch" data-active="test" role="group" aria-label="Mode">
          <span class="mode-thumb" aria-hidden="true"></span>
          <button type="button" class="mode-opt" data-mode="practice" aria-pressed="false">Practice</button>
          <button type="button" class="mode-opt" data-mode="test" aria-pressed="true">Test</button>
        </div>
      </div>

      <div class="toggle-group hidden" id="lesson-group">
        <div class="toggle-label label-row">
          <span>Lessons</span>
          <button type="button" class="link-btn" id="lesson-all-btn">Clear</button>
        </div>
        <div class="toggle-row" id="lesson-row"></div>
      </div>

      <div class="toggle-group">
