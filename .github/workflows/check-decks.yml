name: Check lessons

# Decks are often added from a phone, through the GitHub web editor, with the CSV generated by
# an AI chat. None of that can run the validator locally — so run it here instead.
on:
  push:
    paths:
      - "app/decks/**"
      - "app/audio/index.json"
      - "tools/check_deck.py"
      - ".github/workflows/check-decks.yml"
  pull_request:
    paths:
      - "app/decks/**"
  workflow_dispatch:

jobs:
  decks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate every deck and the manifest
        run: python tools/check_deck.py --all
